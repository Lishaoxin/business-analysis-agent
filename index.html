<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>业务数据分析 Agent</title>
    <style>
        body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
        textarea { display: block; box-sizing: border-box; width: 100%; margin: 12px 0; font: inherit; }
        button { padding: 8px 18px; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.7; }
        .turn { border-bottom: 1px solid #ddd; padding: 4px 0 16px; margin-bottom: 16px; }
        .hint { color: #555; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>业务数据分析 Agent</h1>
    <form id="analysis-form">
        <label for="question">请输入分析问题</label>
        <textarea id="question" rows="4" required
            placeholder="例如：2026年9月的已支付销售额是多少元？"></textarea>
        <button id="submit-button" type="submit">发送问题</button>
        <button id="new-session-button" type="button">新会话</button>
    </form>
    <p id="status" role="status">可以连续追问，点击“新会话”可重新开始。</p>
    <p class="hint">工具进度实时显示，正式回答在任务结束后展示。刷新后仍可继续当前会话；下方仅显示本次打开页面后的问答。</p>

    <h2>对话记录</h2>
    <div id="conversation"></div>

    <h2>本轮工具调用记录</h2>
    <div id="steps"></div>

    <h2>本轮图表</h2>
    <div id="charts"></div>

    <script>
        const form = document.getElementById("analysis-form");
        const questionInput = document.getElementById("question");
        const button = document.getElementById("submit-button");
        const newSessionButton = document.getElementById("new-session-button");
        const statusText = document.getElementById("status");
        const conversation = document.getElementById("conversation");
        const steps = document.getElementById("steps");
        const charts = document.getElementById("charts");

        const SESSION_KEY = "business-agent-thread-id";
        let threadId = sessionStorage.getItem(SESSION_KEY) || crypto.randomUUID();
        sessionStorage.setItem(SESSION_KEY, threadId);
        let busy = false;
        const toolItems = new Map();

        // 按行处理SSE；网络数据块可以在任意字节处断开。
        async function readSse(response, onEvent) {
            if (!response.body) throw new Error("浏览器没有提供流式响应");
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8", { fatal: true });
            let buffer = "";
            let eventName = "message";
            let dataLines = [];

            function handleLine(line) {
                if (line === "") {
                    const name = eventName;
                    const lines = dataLines;
                    eventName = "message";
                    dataLines = [];
                    if (lines.length === 0) return true;
                    return onEvent({ event: name, data: JSON.parse(lines.join("\n")) }) !== false;
                }
                if (line.startsWith(":")) return true;
                const colon = line.indexOf(":");
                const field = colon < 0 ? line : line.slice(0, colon);
                let value = colon < 0 ? "" : line.slice(colon + 1);
                if (value.startsWith(" ")) value = value.slice(1);
                if (field === "event") eventName = value || "message";
                if (field === "data") dataLines.push(value);
                return true;
            }

            function parseLines(flush) {
                while (true) {
                    const end = buffer.search(/[\r\n]/);
                    if (end < 0) return true;
                    if (!flush && buffer[end] === "\r" && end === buffer.length - 1) return true;
                    const line = buffer.slice(0, end);
                    const length = buffer[end] === "\r" && buffer[end + 1] === "\n" ? 2 : 1;
                    buffer = buffer.slice(end + length);
                    if (!handleLine(line)) return false;
                }
            }

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        buffer += decoder.decode();
                        parseLines(true);
                        break;
                    }
                    buffer += decoder.decode(value, { stream: true });
                    if (!parseLines(false)) break;
                }
            } finally {
                try { await reader.cancel(); } catch { /* 连接可能已经结束。 */ }
                reader.releaseLock();
            }
        }

        function setBusy(value) {
            busy = value;
            button.disabled = value;
            newSessionButton.disabled = value;
            questionInput.disabled = value;
        }

        function appendTurn(question, answerText) {
            const turn = document.createElement("section");
            turn.className = "turn";
            const heading = document.createElement("h3");
            heading.textContent = "问题：" + question;
            const answer = document.createElement("pre");
            answer.textContent = answerText;
            turn.appendChild(heading);
            turn.appendChild(answer);
            conversation.appendChild(turn);
        }

        function renderTool(step) {
            if (typeof step.tool_call_id !== "string" || !step.tool_call_id) {
                throw new Error("工具进度缺少调用编号");
            }
            let record = toolItems.get(step.tool_call_id);
            if (!record) {
                const item = document.createElement("details");
                const summary = document.createElement("summary");
                const content = document.createElement("pre");
                item.appendChild(summary);
                item.appendChild(content);
                steps.appendChild(item);
                record = { summary, content, step };
                toolItems.set(step.tool_call_id, record);
            }
            record.step = step;
            const label = step.result === undefined ? "执行中" : (step.result.ok ? "成功" : "失败");
            record.summary.textContent = "第 " + step.round + " 轮：" + step.tool_name + "（" + label + "）";
            record.content.textContent = JSON.stringify(step, null, 2);
        }

        function markUnfinishedTools() {
            for (const record of toolItems.values()) {
                const step = record.step;
                if (step.result === undefined) {
                    record.summary.textContent = "第 " + step.round + " 轮：" + step.tool_name + "（未收到结果）";
                }
            }
        }

        function renderFinal(question, data) {
            const labels = {
                completed: "分析完成",
                needs_clarification: "需要补充信息",
                failed: "本次分析未完成"
            };
            if (!Object.hasOwn(labels, data.status) || typeof data.answer !== "string" ||
                !data.answer.trim() || !Array.isArray(data.steps) || !Array.isArray(data.charts)) {
                throw new Error("任务结束信息格式不正确");
            }
            steps.replaceChildren();
            toolItems.clear();
            for (const step of data.steps) renderTool(step);
            if (data.steps.length === 0) steps.textContent = "本次分析未调用工具";
            charts.replaceChildren();
            if (data.charts.length === 0) charts.textContent = "本次分析未生成图表";
            for (const chartUrl of data.charts) {
                const image = document.createElement("img");
                image.src = chartUrl;
                image.alt = "本次分析生成的图表";
                image.style.maxWidth = "100%";
                charts.appendChild(image);
            }
            appendTurn(question, data.answer);
            threadId = data.thread_id;
            sessionStorage.setItem(SESSION_KEY, threadId);
            statusText.textContent = labels[data.status];
            questionInput.value = "";
        }

        newSessionButton.addEventListener("click", () => {
            if (busy) return;
            threadId = crypto.randomUUID();
            sessionStorage.setItem(SESSION_KEY, threadId);
            conversation.replaceChildren();
            steps.replaceChildren();
            toolItems.clear();
            charts.replaceChildren();
            questionInput.value = "";
            statusText.textContent = "已开始新会话，请输入问题。";
            questionInput.focus();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (busy) return;
            const question = questionInput.value.trim();
            if (!question) {
                statusText.textContent = "请输入分析问题";
                return;
            }
            const requestThreadId = threadId;
            setBusy(true);
            statusText.textContent = "正在分析，请稍候……";
            steps.replaceChildren();
            toolItems.clear();
            charts.replaceChildren();

            try {
                const response = await fetch("/analyze/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
                    body: JSON.stringify({ question: question, thread_id: requestThreadId })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(typeof error.detail === "string" ? error.detail : "请求失败，请检查输入或稍后重试");
                }
                if (!response.headers.get("content-type")?.includes("text/event-stream")) {
                    throw new Error("接口没有返回事件流，请确认后端已更新");
                }

                let terminalReceived = false;
                await readSse(response, ({ event, data }) => {
                    if (!data || typeof data !== "object" || Array.isArray(data)) {
                        throw new Error("事件数据格式不正确");
                    }
                    if (event === "tool_start") {
                        renderTool(data);
                        statusText.textContent = "正在执行工具：" + data.tool_name;
                    } else if (event === "tool_result") {
                        if (!data.result || typeof data.result.ok !== "boolean") {
                            throw new Error("工具结果格式不正确");
                        }
                        renderTool(data);
                        statusText.textContent = "已收到工具结果，等待模型继续处理……";
                    } else if (event === "final" || event === "error") {
                        if (data.thread_id !== requestThreadId) throw new Error("返回的会话编号与本次请求不一致");
                        if (event === "error") throw new Error(data.message || "本次执行无法继续");
                        renderFinal(question, data);
                        terminalReceived = true;
                        return false;
                    } else {
                        throw new Error("收到未知事件：" + event);
                    }
                    return true;
                });
                if (!terminalReceived) throw new Error("连接提前结束，未收到最终结果；请稍候再试");
            } catch (error) {
                markUnfinishedTools();
                statusText.textContent = "请求失败：" + error.message;
            } finally {
                setBusy(false);
                questionInput.focus();
            }
        });
    </script>
</body>
</html>
