name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Windows / Python 3.12 / Node 22
    runs-on: windows-2025
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run offline regression checks
        run: python -X utf8 run_checks.py --include-web
